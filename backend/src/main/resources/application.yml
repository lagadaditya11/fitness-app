server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness
    username: fitness
    password: fitness
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-in-production-please-32bytes}
    expiration-ms: 86400000
